<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動画再生</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }
    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
    }

    /* ポップアップ（モーダル）のスタイル */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      z-index: 100;
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-content {
      background: #ffffff;
      padding: 30px 40px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      max-width: 90%;
      width: 400px;
    }
    .modal-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 20px;
    }
    .btn-reward {
      display: inline-block;
      width: 100%;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: #fff;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: bold;
      padding: 14px 20px;
      border-radius: 30px;
      transition: transform 0.2s ease, opacity 0.2s ease;
      cursor: pointer;
    }
    .btn-reward:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Googleドライブの埋め込み -->
  <iframe 
    src="https://drive.google.com/file/d/168NZUjmFLDUAEeL9-gyzJnHRjxdTkrh-/preview?autoplay=1" 
    allow="autoplay; fullscreen">
  </iframe>

  <!-- ポップアップモーダル -->
  <div class="modal-overlay" id="rewardModal">
    <div class="modal-content">
      <div class="modal-title">ご視聴ありがとうございました！</div>
      <a href="https://www.sokagakkai.jp/" class="btn-reward">特典を受け取る</a>
    </div>
  </div>

  <script>
    // ★★★ ここに動画の長さ（秒数）を入力してください（例: 20秒なら 20） ★★★
    const videoDurationSeconds = 15;

    // 指定秒数後にポップアップを表示
    setTimeout(() => {
      document.getElementById('rewardModal').classList.add('active');
    }, videoDurationSeconds * 1000);
  </script>
</body>
</html>
