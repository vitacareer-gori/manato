<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動画再生中...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Googleドライブの埋め込みプレイヤー -->
  <iframe 
    src="https://drive.google.com/file/d/1hDHp-y0dwSEWIjr-x6jSlORcsP6WTB7B/preview" 
    allow="autoplay; fullscreen">
  </iframe>

  <script>
    const targetUrl = 'https://www.sokagakkai.jp/';
    
    // ★★★ ここに動画の長さ（秒数）を指定してください（例: 15秒なら 15） ★★★
    const videoDurationSeconds = 15; 

    // 動画終了予測時間（秒数 × 1000ミリ秒）後に自動でリンク先へ移動
    setTimeout(() => {
      window.location.href = targetUrl;
    }, videoDurationSeconds * 1000);
  </script>
</body>
</html>
