<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動画再生</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }
    #player {
      width: 100vw;
      height: 100vh;
    }

    /* ポップアップ（モーダル）のスタイル */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      z-index: 100;
    }
    /* 表示状態 */
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-content {
      background: #ffffff;
      padding: 30px 40px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      max-width: 90%;
      width: 400px;
    }
    .modal-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 20px;
    }
    .btn-reward {
      display: inline-block;
      width: 100%;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: #fff;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: bold;
      padding: 14px 20px;
      border-radius: 30px;
      transition: transform 0.2s ease, opacity 0.2s ease;
      cursor: pointer;
    }
    .btn-reward:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- YouTubeプレイヤー埋め込み -->
  <div id="player"></div>

  <!-- ポップアップモーダル -->
  <div class="modal-overlay" id="rewardModal">
    <div class="modal-content">
      <div class="modal-title">ご視聴ありがとうございました！</div>
      <a href="https://www.sokagakkai.jp/" class="btn-reward" id="rewardLink">特典を受け取る</a>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // ★★★ YouTubeの動画IDを入れてください ★★★
    const videoId = 'YOUTUBE_VIDEO_ID'; 

    let player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: videoId,
        playerVars: {
          autoplay: 1,
          mute: 1,
          controls: 0,
          rel: 0,
          playsinline: 1
        },
        events: {
          'onReady': (event) => event.target.playVideo(),
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      // 動画が最後まで再生されたとき（YT.PlayerState.ENDED）
      if (event.data === YT.PlayerState.ENDED) {
        document.getElementById('rewardModal').classList.add('active');
      }
    }
  </script>
</body>
</html>
