<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動画再生中...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>

  <!-- 新しいGoogleドライブの動画を埋め込み -->
  <iframe 
    src="https://drive.google.com/file/d/168NZUjmFLDUAEeL9-gyzJnHRjxdTkrh-/preview?autoplay=1" 
    allow="autoplay; fullscreen">
  </iframe>

  <script>
    const targetUrl = 'https://www.sokagakkai.jp/';
    
    // ★★★ 新しい動画の長さに合わせて秒数を変更してください（例: 30秒なら 30） ★★★
    const videoDurationSeconds = 15; 

    // 指定した秒数（×1000ミリ秒）が経過した後に自動でリンク先へ移動
    setTimeout(() => {
      window.location.href = targetUrl;
    }, videoDurationSeconds * 1000);
  </script>
</body>
</html>
